# Generated by devtools-check.py --fix from devtools.toml's [dependabot] table: edit that
# table rather than this file, which `devtools-check.py` compares with what it generates.
#
# Weekly updates, one grouped pull request per ecosystem. A release is taken once it is
# three days old, so a hijacked version has usually been pulled before an update proposes
# it; the packages released from the same hands are taken at once.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
    groups:
      actions:
        patterns:
          - "*"

  # Gradle plugins and AndroidX dependencies: routine minor and patch bumps arrive as one pull
  # request, while major bumps (AGP and Kotlin especially) come separately for review.
  #
  # Kotlin artifacts must match the Kotlin version AGP bundles for its built-in Kotlin support, not
  # the newest release: a mismatch fails the build with "Module was compiled with an incompatible
  # version of Kotlin". Dependabot cannot see that coupling, so they are bumped by hand with AGP.
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
    ignore:
      - dependency-name: "org.jetbrains.kotlin:*"
    groups:
      gradle-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
