version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"

  # Gradle plugins and AndroidX dependencies. Grouped so routine patch/minor bumps arrive
  # as one PR, while major bumps (AGP and Kotlin especially) come separately for review.
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      gradle-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Kotlin artifacts must match the Kotlin version AGP bundles for its built-in Kotlin
      # support, not the newest release: a mismatch fails the build with "Module was compiled
      # with an incompatible version of Kotlin". Dependabot cannot see that coupling, so these
      # are bumped by hand alongside AGP instead.
      - dependency-name: "org.jetbrains.kotlin:*"
