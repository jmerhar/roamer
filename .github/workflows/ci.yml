name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    # contents: read for checkout; statuses: write to link the published coverage report.
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      # Verifies the committed gradle-wrapper.jar matches a published Gradle release.
      - uses: gradle/actions/wrapper-validation@v6
      - uses: gradle/actions/setup-gradle@v6

      - name: ShellCheck
        run: shellcheck bin/*.sh test/test_helper.bash test/stubs/*

      # Debug unit tests with a Kover report; the Debug variant matches the unit tests.
      # --continue so a failure still leaves complete JUnit results for Codecov below.
      - name: Unit tests with coverage
        run: ./gradlew testDebugUnitTest koverHtmlReportDebug koverXmlReportDebug --continue

      # The release-script tests under kcov, as declared on the scripts suite in coverage.toml. kcov
      # has no Ubuntu 24.04 package, so this takes the pinned kcov container.
      - uses: jmerhar/coverage/.github/actions/kcov@v1
        with:
          junit-dir: junit

      - name: Android Lint
        run: ./gradlew lint

      # Builds the release variant so R8/minification breakage surfaces here rather than
      # at release time. No signing credentials are present, so the APK is unsigned.
      - name: Release build
        run: ./gradlew assembleRelease

      # The suites, their labels and their gates are declared in coverage.toml; the tooling behind
      # this and the coverage steps below is shared by every project publishing to the coverage site.
      - uses: jmerhar/coverage/.github/actions/summary@v1
        if: ${{ !cancelled() }}

      # Informational, never fails the build. Each suite uploads under its own flag; the JUnit
      # reports give Codecov flake and failure history. Before the gate, so the data still lands
      # when the gate fails, and `!cancelled()` so a failing suite still reports its failures.
      - uses: jmerhar/coverage/.github/actions/codecov@v1
        if: ${{ !cancelled() }}
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          junit: app/build/test-results/testDebugUnitTest/*.xml,junit/report.xml

      # Fails the build if either suite's line coverage drops below its bound in coverage.toml.
      - uses: jmerhar/coverage/.github/actions/gate@v1

      # Publishes this commit's HTML reports to the coverage site and links them from the commit.
      # Only on green pushes to main; the action skips when the token is absent.
      - uses: jmerhar/coverage/.github/actions/publish@v1
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          token: ${{ secrets.COVERAGE_PAGES_TOKEN }}

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: app/build/reports/
          if-no-files-found: ignore
